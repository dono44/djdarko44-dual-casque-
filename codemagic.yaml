workflows:
  android-release:
    name: Android Release

    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - chmod +x ./gradlew
      - ./gradlew clean
      - ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab

    publishing:
      email:
